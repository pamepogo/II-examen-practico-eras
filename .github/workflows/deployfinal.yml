# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Despliegue - Eras

on:
  push:
    branches: ["eras"]
  pull_request:
    branches: ["eras"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with pytest
      run: |
        pytest test_app.py -v --tb=short
        echo "All tests passed!"

  build:
    name: Build and Push
    needs: test 
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/byronmoreno/eras:1.0.5

  deploy:
    name: Deploy to VPS
    needs: build  
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name:  Copy stack.yml to VPS
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/automatizar"

    - name:  Deploy services on VPS
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo " Logging in to GHCR..."
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u byronmoreno --password-stdin
          
          echo " Pulling latest image..."
          docker pull ghcr.io/byronmoreno/eras:1.0.5
          
          echo " Removing old stack..."
          docker stack rm quintobm || true
          
          echo " Waiting for cleanup..."
          sleep 20
          
          echo " Deploying new stack..."
          cd ~/automatizar
          docker stack deploy --with-registry-auth -c stack.yml quintobm
          
          echo " Waiting for services to start..."
          sleep 10
          
          echo " Deployment complete! Checking services..."
          docker service ls
          docker service ps quintobm_eras
