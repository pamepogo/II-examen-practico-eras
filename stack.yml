version: "3.9"

services:
  eras:
    image: ghcr.io/pamepogo/eras:1.0.5
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    deploy:
      replicas: 1
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.eras.entrypoints=http'
        - 'traefik.http.routers.eras.rule=Host(`eras.byronrm.com`)'
        - 'traefik.http.middlewares.eras-https-redirect.redirectscheme.scheme=https'
        - 'traefik.http.routers.eras.middlewares=eras-https-redirect'
        - 'traefik.http.routers.eras-secure.entrypoints=https'
        - 'traefik.http.routers.eras-secure.rule=Host(`eras.byronrm.com`)'
        - 'traefik.http.routers.eras-secure.tls=true'
        - 'traefik.http.routers.eras-secure.tls.certresolver=http'
        - 'traefik.http.routers.eras-secure.service=eras'
        - 'traefik.http.services.eras.loadbalancer.server.port=5050'
        - 'traefik.docker.network=traefik-public'
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true